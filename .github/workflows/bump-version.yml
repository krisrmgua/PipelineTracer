# After every push to main (feature merges), bump the patch version and
# land it via a short-lived PR so this also works with branch protection.
# Release commits include [skip ci] so this job does not loop.
#
# Bot PRs created with GITHUB_TOKEN do not get workflow checks, so this
# merges as soon as the PR opens (main still requires a PR; CodeQL still
# runs on human feature PRs).
name: bump-version

on:
  push:
    branches: [main]

concurrency:
  group: bump-version
  cancel-in-progress: false

jobs:
  bump:
    if: >-
      github.event.head_commit != null &&
      !contains(github.event.head_commit.message, '[skip ci]') &&
      !startsWith(github.event.head_commit.message, 'chore: release')
    runs-on: pipelinetracer-msi
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # The self-hosted runner image has no GitHub CLI. Install a pinned release into RUNNER_TEMP.
      - name: Install GitHub CLI
        env:
          GH_VERSION: "2.63.2"
        run: |
          set -euo pipefail
          arch="$(dpkg --print-architecture)"
          curl -fsSL "https://github.com/cli/cli/releases/download/v${GH_VERSION}/gh_${GH_VERSION}_linux_${arch}.tar.gz" \
            | tar -xz -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/gh_${GH_VERSION}_linux_${arch}/bin" >> "$GITHUB_PATH"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Bump patch
        id: ver
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          npm version patch --no-git-tag-version
          VERSION="$(node -p "require('./package.json').version")"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Bumped to $VERSION"

      - name: Create release PR
        id: cpr
        uses: peter-evans/create-pull-request@v7
        with:
          commit-message: "chore: release ${{ steps.ver.outputs.version }} [skip ci]"
          title: "chore: release ${{ steps.ver.outputs.version }}"
          body: Automated patch bump after a merge to main. Do not edit version by hand in feature PRs.
          branch: chore/release-version
          delete-branch: true

      - name: Merge release PR and tag
        if: steps.cpr.outputs.pull-request-number != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.ver.outputs.version }}
          PR: ${{ steps.cpr.outputs.pull-request-number }}
        run: |
          set -euo pipefail
          gh pr merge "$PR" --squash \
            --subject "chore: release ${VERSION} [skip ci]" \
            --body "Automated patch bump."
          git fetch origin main
          git tag -f "v${VERSION}" "origin/main"
          git push origin "v${VERSION}"
          # Best-effort cleanup over git. A failure here must not fail the release.
          git push origin --delete "chore/release-version" || echo "::warning::could not delete chore/release-version"
